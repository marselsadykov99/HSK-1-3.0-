["10. Друзья","我 有 两 个 好 朋友 。 一 个 是 中国 人 ， 一 个 是 美国 人 。 我们 都 喜欢 学习 汉语 。","У меня два хороших друга. Один китаец, другой американец. Мы все любим учить китайский.","Сколько друзей?",["Один","Два","Три","Пять"],1],
